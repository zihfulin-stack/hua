<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="次數紀錄">
<meta name="theme-color" content="#f6f8f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>次數紀錄</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--text:#1d1f1e;--muted:#84898a;--line:#e8ecea;--accent:#1f9d6b;--accent-soft:#dff3ea;--danger:#e5484d}
@media (prefers-color-scheme: dark){
  :root{--bg:#15181a;--card:#1f2326;--text:#eff1f0;--muted:#979c9d;--line:#2d3236;--accent:#35c389;--accent-soft:#1d3a2f;--danger:#ff5a60}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 28px)}
.wrap{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
.top h1{font-size:24px;margin:0}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}
.btn{border:0;background:var(--line);color:var(--text);border-radius:12px;padding:9px 14px;font-size:15px;font-family:inherit;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:transparent;color:var(--danger)}
.btn.link{background:transparent;color:var(--muted);padding:6px 4px;font-size:14px}
.btn.block{display:block;width:100%;padding:13px;margin-top:8px;font-size:16px}
.btn.big{display:block;width:100%;padding:16px;font-size:18px;font-weight:700;margin-top:12px;border-radius:14px}
.btn:disabled{opacity:1;background:var(--accent-soft);color:var(--accent)}
.ihead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ihead h2{margin:0;font-size:19px;word-break:break-all}
.more{font-size:22px;line-height:1;padding:4px 10px}
.prog{display:flex;align-items:center;gap:8px;margin-top:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}
.count{color:var(--muted);font-size:14px}
.recs{list-style:none;margin:12px 0 0;padding:0}
.recs li{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.recs li b{font-weight:600}
.recs li span{color:var(--muted);font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
details.hist{margin-top:8px;font-size:14px;color:var(--muted)}
details.hist summary{cursor:pointer;padding:4px 2px}
details.hist .round{padding:6px 2px;border-top:1px dashed var(--line);line-height:1.7}
.empty{text-align:center;color:var(--muted);padding:40px 10px;line-height:1.8}
.small{font-size:12px;color:var(--muted);line-height:1.6;text-align:center;margin-top:18px}
.backup{display:flex;justify-content:center;gap:8px;margin-top:8px}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;max-width:560px;margin:0 auto;
  padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .25s}
.open .backdrop{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.sheet h3{margin:0 0 10px;font-size:19px}
.sheet label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.sheet input{width:100%;font-size:17px;font-family:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>次數紀錄</h1>
    <button class="btn primary" id="addBtn">＋ 新增項目</button>
  </div>
  <div id="list"></div>
  <div class="backup">
    <button class="btn link" id="exportBtn">匯出備份</button>
    <button class="btn link" id="importBtn">匯入備份</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
  <p class="small">資料只存在這支手機裡。點紀錄可以修改日期或刪除。</p>
</div>

<div id="sheetRoot">
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const KEY = 'counter-app-v1';
const $ = id => document.getElementById(id);
const WD = ['日','一','二','三','四','五','六'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const fmt = iso => { const d = new Date(iso); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}（${WD[d.getDay()]}）${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtShort = iso => { const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()}`; };
const toLocalInput = iso => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---- 資料 ----
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.items)) return s; } catch (e) {}
  return { items: [] };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { toast('無法儲存資料'); } }
let D = load();
const item = id => D.items.find(i => i.id === id);

// ---- 畫面 ----
function render() {
  if (!D.items.length) {
    $('list').innerHTML = '<div class="card empty">還沒有項目<br>按右上角「＋ 新增項目」開始</div>';
    return;
  }
  $('list').innerHTML = D.items.map(it => {
    const n = it.records.length, done = n >= it.target;
    const dots = Array.from({ length: it.target }, (_, i) => `<div class="dot${i < n ? ' on' : ''}"></div>`).join('');
    const recs = it.records.map((r, i) => `<li data-act="rec" data-id="${it.id}" data-i="${i}"><b>第 ${i+1} 次</b><span>${fmt(r)}</span></li>`).join('');
    const btn = done
      ? `<button class="btn big" disabled>✓ 已完成 ${it.target} 次</button><button class="btn block" data-act="restart" data-id="${it.id}">開始新一輪</button>`
      : `<button class="btn big primary" data-act="tap" data-id="${it.id}">確認　第 ${n+1} 次</button>`;
    const hist = it.history.length ? `<details class="hist"><summary>過去完成 ${it.history.length} 輪</summary>${
      it.history.slice().reverse().map((h, k) => `<div class="round">第 ${it.history.length - k} 輪：${h.records.map(fmtShort).join('、')}</div>`).join('')}</details>` : '';
    return `<div class="card">
      <div class="ihead"><h2>${esc(it.name)}</h2><button class="btn link more" data-act="menu" data-id="${it.id}" aria-label="選項">⋯</button></div>
      <div class="prog"><div class="dots">${dots}</div><span class="count">${n} / ${it.target}</span></div>
      ${btn}
      ${n ? `<ul class="recs">${recs}</ul>` : ''}
      ${n && !done ? `<div class="foot"><span></span><button class="btn link" data-act="undo" data-id="${it.id}">復原上一筆</button></div>` : ''}
      ${hist}
    </div>`;
  }).join('');
}

let tt;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }

// ---- 底部面板 ----
function openSheet(html) { $('sheet').innerHTML = html + '<button class="btn block" data-act="close">取消</button>'; $('sheetRoot').classList.add('open'); }
function closeSheet() { $('sheetRoot').classList.remove('open'); document.activeElement && document.activeElement.blur(); }
$('backdrop').onclick = closeSheet;

function editItemSheet(it) {
  openSheet(`<h3>${it ? '編輯項目' : '新增項目'}</h3>
    <label>名稱</label><input id="fName" maxlength="40" value="${it ? esc(it.name) : ''}" placeholder="例如：A 項目">
    <label>需要幾次才算完成</label><input id="fTarget" type="number" inputmode="numeric" min="1" max="30" value="${it ? it.target : 6}">
    <button class="btn block primary" data-act="saveItem" data-id="${it ? it.id : ''}">儲存</button>`);
  setTimeout(() => !it && $('fName').focus(), 300);
}

// ---- 操作 ----
const lastTap = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, it = el.dataset.id ? item(el.dataset.id) : null;

  if (act === 'close') return closeSheet();
  if (act === 'tap' && it && it.records.length < it.target) {
    if (Date.now() - (lastTap[it.id] || 0) < 1500) return;   // 防止連點重複記錄
    lastTap[it.id] = Date.now();
    it.records.push(new Date().toISOString());
    save(); render();
    if (navigator.vibrate) navigator.vibrate(30);
    toast(it.records.length >= it.target ? `「${it.name}」完成 ${it.target} 次 🎉` : `已記錄第 ${it.records.length} 次`);
  }
  if (act === 'undo' && it && it.records.length) {
    if (!confirm(`刪除「${it.name}」的第 ${it.records.length} 次紀錄？`)) return;
    it.records.pop(); save(); render();
  }
  if (act === 'restart' && it) {
    it.history.push({ done: it.records[it.records.length - 1], records: it.records });
    it.records = []; save(); render(); closeSheet();
  }
  if (act === 'menu' && it) {
    openSheet(`<h3>${esc(it.name)}</h3>
      <button class="btn block" data-act="edit" data-id="${it.id}">改名稱／次數</button>
      ${it.records.length ? `<button class="btn block" data-act="restart" data-id="${it.id}">結束這輪，重新開始</button>` : ''}
      <button class="btn block danger" data-act="del" data-id="${it.id}">刪除這個項目</button>`);
  }
  if (act === 'edit' && it) editItemSheet(it);
  if (act === 'saveItem') {
    const name = $('fName').value.trim();
    const target = Math.min(30, Math.max(1, parseInt($('fTarget').value, 10) || 6));
    if (!name) { $('fName').focus(); return; }
    if (it) {
      if (target < it.records.length && !confirm(`目前已有 ${it.records.length} 筆紀錄，改成 ${target} 次會刪掉多出來的紀錄，確定嗎？`)) return;
      it.name = name; it.target = target; it.records = it.records.slice(0, target);
    } else {
      D.items.push({ id: uid(), name, target, records: [], history: [], created: new Date().toISOString() });
    }
    save(); render(); closeSheet();
  }
  if (act === 'del' && it) {
    if (!confirm(`確定刪除「${it.name}」和它所有的紀錄？`)) return;
    D.items = D.items.filter(x => x !== it); save(); render(); closeSheet();
  }
  if (act === 'rec' && it) {
    const i = +el.dataset.i;
    openSheet(`<h3>${esc(it.name)}・第 ${i+1} 次</h3>
      <label>日期時間</label><input id="fDate" type="datetime-local" value="${toLocalInput(it.records[i])}">
      <button class="btn block primary" data-act="saveRec" data-id="${it.id}" data-i="${i}">儲存</button>
      <button class="btn block danger" data-act="delRec" data-id="${it.id}" data-i="${i}">刪除這筆紀錄</button>`);
  }
  if (act === 'saveRec' && it) {
    const v = $('fDate').value; if (!v) return;
    it.records[+el.dataset.i] = new Date(v).toISOString();
    save(); render(); closeSheet();
  }
  if (act === 'delRec' && it) {
    if (!confirm('刪除這筆紀錄？後面的次數會往前遞補。')) return;
    it.records.splice(+el.dataset.i, 1); save(); render(); closeSheet();
  }
});
$('addBtn').onclick = () => editItemSheet(null);

// ---- 備份 ----
$('exportBtn').onclick = async () => {
  const d = new Date(), name = `counter-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.items) || !d.items.every(i => i.id && typeof i.name === 'string' && Array.isArray(i.records))) throw 0;
    d.items.forEach(i => { i.history = i.history || []; i.target = i.target || 6; });
    if (!confirm(`備份內有 ${d.items.length} 個項目，要取代目前的資料嗎？`)) return;
    D = d; save(); render();
  } catch (_) { alert('這不是有效的備份檔。'); }
};

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
